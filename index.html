<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
    integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
    crossorigin="anonymous" referrerpolicy="no-referrer">
  <title>Document</title>
</head>

<body>
  <div class="game-container">
    <h1>Tetris</h1>

    <div class="game-layout">
      <div class="board">
        <div class="math-question">
          <div class="math-text"></div>
          <div class="math-time"></div>
          <input type="number" class="math-answer" placeholder="Nhập đáp án">
          <button class="math-submit">Trả lời</button>
        </div>
      </div>
      <div class="game-info">
        <div class="level">Level 0</div>
        <div class="line">Line 0 / 10</div>
        <button class="hope-star"><i class="fa-regular fa-star"></i><span>Ngôi sao hy vọng</span></button>
        <button class="back">Back</button>
        <button class="next">Next</button>
      </div>
    </div>
  </div>
  <script src="./js/gamepad.js"></script>
</body>

</html>
