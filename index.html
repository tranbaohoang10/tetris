<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./fontawesome/css/all.min.css">
  <title>Tetris</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #ddd;
      font-family: Arial, Helvetica, sans-serif;
    }

    .game-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .game-container h1 {
      text-align: center;
    }

    .game-layout {
      display: flex;
      justify-content: center;
      align-items: flex-start;
      gap: 30px;
    }

    .board {
      width: 300px;
      height: 600px;
      background-color: #111;
      display: grid;
      grid-template-columns: repeat(10, 1fr);
      grid-template-rows: repeat(20, 1fr);
      border: 2px solid #333;
      position: relative;
    }

    .game-info {
      width: 180px;
      font-size: 20px;
    }

    .level,
    .line,
    .next {
      margin-bottom: 15px;
    }

    .matrix {
      border: 1px solid #333;
    }

    .block {
      border: 1px solid #222;
    }

    .block-square {
      background-color: yellow;
    }

    .block-i {
      background-color: cyan;
    }

    .block-t {
      background-color: purple;
    }

    .block-s {
      background-color: green;
    }

    .block-z {
      background-color: red;
    }

    .block-j {
      background-color: blue;
    }

    .block-l {
      background-color: orange;
    }

    .block-garbage {
      background-color: gray;
    }

    .hope-star {
      background: none;
      border: 1px solid #333;
      border-radius: 4px;
      padding: 6px 10px;
      cursor: pointer;
    }

    .hope-star i {
      font-size: 22px;
    }

    .hope-star:hover i {
      color: #ffc107;
      font-weight: 900;
    }

    .math-question {
      display: none;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 10;
      width: 230px;
      box-sizing: border-box;
      padding: 12px;
      background-color: #eee;
      border: 1px solid #333;
      text-align: center;
    }

    .math-text,
    .math-time {
      margin-bottom: 10px;
    }

    .math-answer {
      width: 100px;
    }

    .bomb-count {
      display: block;
      margin-bottom: 15px;
    }

    .eye-count {
      display: block;
      margin-bottom: 15px;
    }

    .use-bomb,
    .use-eye {
      display: block;
      margin-bottom: 15px;
      padding: 8px 15px;
      cursor: pointer;
    }

    .worm {
      position: absolute;
      width: 30px;
      height: 30px;
      object-fit: contain;
      z-index: 2;
      pointer-events: none;
    }

    .traffic-light {
      display: none;
      background-color: green;
      color: white;
      text-align: center;
      padding: 10px;
      margin-bottom: 15px;
      border-radius: 5px;
    }

    .traffic-light.red {
      background-color: red;
    }

    .bomb-count i,
    .eye-count i,
    .use-bomb i,
    .use-eye i {
      margin-right: 6px;
    }

    .board .matrix.hidden-block {
      background-color: #111;
      border: 1px solid #333;
    }

    .pause {
      display: block;
      padding: 8px 15px;
      margin-bottom: 15px;
      cursor: pointer;
    }

    .back,
    .next,
    .pause {
      padding: 8px;
      margin-top: 15px;
    }
  </style>
</head>

<body>
  <div class="game-container">
    <h1>Tetris</h1>

    <div class="game-layout">
      <div class="board">
        <div class="math-question">
          <div class="math-text"></div>
          <div class="math-time"></div>
          <input type="number" class="math-answer" placeholder="Nhập đáp án">
          <button class="math-submit">Trả lời</button>
        </div>
      </div>
      <div class="game-info">
        <div class="level">Level 1</div>
        <div class="traffic-light">Đèn xanh: 5 giây</div>
        <div class="line">Line 0 / 10</div>
        <span class="bomb-count">
          <i class="fa-solid fa-bomb"></i>
          <span class="bomb-text">Bom: 0</span>
        </span>
        <span class="eye-count">
          <i class="fa-solid fa-eye"></i>
          <span class="eye-text">Mắt: 0</span>
        </span>
        <button class="use-bomb">
          <i class="fa-solid fa-bomb"></i>
          <span>Dùng Bom</span>
        </button>
        <button class="use-eye">
          <i class="fa-solid fa-eye"></i>
          <span>Dùng Mắt</span>
        </button>
        <button class="hope-star">
          <i class="fa-regular fa-star"></i>
          <span>Ngôi sao hy vọng</span>
        </button>
        <button class="pause">
          <i class="fa-solid fa-pause"></i>
          <span>Tạm dừng</span>
        </button>
        <button class="back">Back Level</button>
        <button class="next">Next Level</button>
      </div>
    </div>
  </div>
  <script src="game.js"></script>
</body>

</html>
